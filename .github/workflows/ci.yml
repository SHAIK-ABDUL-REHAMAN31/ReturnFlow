name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Test, Smoke & Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: 4000
      MONGO_URI: mongodb://localhost:27017/returnflow-test
      JWT_ACCESS_SECRET: local_dev_access_secret_min_32_characters_long_12345
      JWT_REFRESH_SECRET: local_dev_refresh_secret_min_32_characters_long_12345
      REDIS_URL: redis://localhost:6379
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: returnflow-demo-bucket
      SQS_LABEL_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/123456789012/test-label-queue
      SQS_REFUND_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/123456789012/test-refund-queue
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:123456789012:returnflow-notifications
      OPENSEARCH_ENDPOINT: https://localhost:9200
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Unit & Integration Tests (38 tests)
        run: npm test

      - name: Run Automated System Smoke Test (8 lifecycle checks)
        run: npm run test:smoke

      - name: Dependency Audit (Fail on High/Critical CVEs)
        run: npm audit --audit-level=high

      - name: Verify Docker Container Build
        run: docker build -t returnflow-backend:test .

  frontend-test:
    name: Frontend Build & Audit Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Next.js Production Build Check (10 routes)
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api

      - name: Dependency Audit (Fail on High/Critical CVEs)
        run: npm audit --audit-level=high
