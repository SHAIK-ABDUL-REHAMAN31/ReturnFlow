name: CD Frontend (S3 & CloudFront Deploy)

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-frontend:
    name: Build & Deploy to S3 + Invalidate CloudFront
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_API_BASE_URL: http://returnflow-alb-2003286988.us-east-1.elb.amazonaws.com/api
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Sync Static Assets to S3
        run: |
          aws s3 sync .next/static s3://${{ secrets.FRONTEND_S3_BUCKET || 'returnflow-abdul-bucket' }}/_next/static --delete

      - name: Invalidate CloudFront Distribution Cache
        env:
          CF_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CF_DISTRIBUTION_ID" ]; then
            echo "Invalidating CloudFront cache for: $CF_DISTRIBUTION_ID"
            aws cloudfront create-invalidation --distribution-id "$CF_DISTRIBUTION_ID" --paths "/*"
          else
            echo "No CLOUDFRONT_DISTRIBUTION_ID configured; skipping invalidation."
          fi


